spring:
  application:
    name: lease-api
  datasource:
    url: "${DATABASE_URL:jdbc:h2:file:./data/lease-api;DB_CLOSE_ON_EXIT=FALSE}"
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  sql:
    init:
      mode: always

lease:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:lease-demo}
    audience: ${JWT_AUDIENCE:lease-platform}
  accounts:
    broker:
      username: ${BROKER_USERNAME}
      password-hash: ${BROKER_PASSWORD_HASH}
    employee:
      username: ${EMPLOYEE_USERNAME}
      password-hash: ${EMPLOYEE_PASSWORD_HASH}
