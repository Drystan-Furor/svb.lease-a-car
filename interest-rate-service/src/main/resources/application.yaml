spring:
  application:
    name: interest-rate-service
  datasource:
    url: "${DATABASE_URL:jdbc:h2:file:./data/interest-rate-service;DB_CLOSE_ON_EXIT=FALSE}"
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  sql:
    init:
      mode: always

lease:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:lease-demo}
    audience: ${JWT_AUDIENCE:lease-platform}
